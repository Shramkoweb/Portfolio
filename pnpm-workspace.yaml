overrides:
  # advisory 1164783 (moderate, unzipSync infinite loop on malformed ZIP64,
  # >=0.7.0 <0.7.5). satori@0.33.5 (via @vercel/og@1.0.3) pins fflate@0.7.3
  # exactly, so the patched line is unreachable without an override.
  # Drop when satori pins fflate >=0.7.5 on its own
  fflate: ^0.7.5
  # advisory 1243379 (moderate, quadratic complexity in flat selector parsing,
  # CPU exhaustion, <6.1.5). @tailwindcss/typography@0.5.20 pins
  # postcss-selector-parser@6.0.10 exactly; 6.1.5 is the 6.x backport, so the
  # override stays on the major typography is written against.
  # Drop when @tailwindcss/typography pins postcss-selector-parser >=6.1.5
  postcss-selector-parser@6: ^6.1.5
  # advisory 1244013 (moderate, AbortSignal cancellation bypass allows
  # post-timeout filesystem traversal, >=9.0.0 <=14.0.1). jest@30.5.2 and
  # test-exclude@7.0.2 ask for glob ^13 / ^10; the fix only shipped in 14.x.
  # Drop when jest and test-exclude depend on glob >=14.0.2
  'glob@>=9.0.0 <14.0.2': ^14.0.2
  # advisory 1244623 (moderate, denial of service via globparts amplification,
  # >=7.0.0 <11.0.1). Pulled by the glob and test-exclude above; the fix only
  # shipped in 11.x. Drop together with the glob override
  'minimatch@>=7.0.0 <11.0.1': ^11.0.1
  # advisory 1248071 (high, ReDoS in Schema.TemplateLiteral compiled regex,
  # <=3.22.0). @prisma/config@7.10.1 (via prisma) pins effect@3.20.0 exactly,
  # and 7.10.1 is the newest stable prisma.
  # Drop when @prisma/config pins effect >=3.22.1
  effect@3: ^3.22.1

allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@sentry/cli': true
  prisma: true
  sharp: true
  unrs-resolver: true

# pnpm >=11 enforces a release cooldown by default (minimumReleaseAge, 1440
# minutes), so a version published less than a day ago will not resolve.
# Every entry in this list waives that cooldown for one exact version.
# The version-exact form is deliberate: it goes inert by itself once the pin
# moves past it, unlike a bare name or a glob ('@types/*'), which would waive
# the cooldown for that package permanently.
# Inert is not harmless — a real waiver is hard to spot among dead ones,
# so on every dep bump prune entries that no longer appear in pnpm-lock.yaml
# or whose version is already past the cooldown.
# pnpm rejects scoped globs with a version, so every package in a scope (each
# @sentry/* package, each ox* platform binding) needs its own entry.
minimumReleaseAgeExclude: []
