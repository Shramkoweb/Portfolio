overrides:
  # advisories 1153173 (high, unsafe deserialization <3.22.0) and 1158532
  # (moderate, <=3.23.0). prisma@7.10.0 pins mysql2@3.15.3 exactly, so the
  # patched line is unreachable without an override. This project is
  # Postgres-only (@prisma/adapter-pg) — the MySQL driver never executes.
  # Drop when prisma pins mysql2 >=3.23.1 on its own
  mysql2: ^3.24.4
  # advisory 1145093 (high, prototype pollution <8.0.0). @prisma/config@7.10.0
  # pins deepmerge-ts@7.1.5 exactly — unreachable without an override.
  # Exercised at build time via prisma.config.ts.
  # Drop when @prisma/config pins deepmerge-ts >=8 on its own
  deepmerge-ts: ^8.0.0

allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@sentry/cli': true
  prisma: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - postcss@8.5.22
  - '@next/env@16.2.12'
  - '@next/swc-darwin-arm64@16.2.12'
  - '@next/swc-darwin-x64@16.2.12'
  - '@next/swc-linux-arm64-gnu@16.2.12'
  - '@next/swc-linux-arm64-musl@16.2.12'
  - '@next/swc-linux-x64-gnu@16.2.12'
  - '@next/swc-linux-x64-musl@16.2.12'
  - '@next/swc-win32-arm64-msvc@16.2.12'
  - '@next/swc-win32-x64-msvc@16.2.12'
  - next@16.2.12
  - '@shikijs/core@4.4.1'
  - '@shikijs/engine-javascript@4.4.1'
  - '@shikijs/engine-oniguruma@4.4.1'
  - '@shikijs/langs@4.4.1'
  - '@shikijs/primitive@4.4.1'
  - '@shikijs/rehype@4.4.1'
  - '@shikijs/themes@4.4.1'
  - '@shikijs/transformers@4.4.1'
  - '@shikijs/types@4.4.1'
  - '@types/react-dom@19.2.4'
  - '@types/react@19.2.18'
  - shiki@4.4.1
