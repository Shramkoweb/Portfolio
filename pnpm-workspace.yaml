overrides:
  # advisory 1117015: postcss <8.5.10 XSS in stringify output; next@16.2.11
  # pins postcss 8.4.31 exactly — drop when next moves past 8.5.10
  postcss: ^8.5.10
  # advisory 1124066: sharp <0.35.0 DoS; next@16.2.11 and @vercel/og@0.11.1
  # both pin ^0.34.5 which cannot reach the patched line — drop when parents
  # allow sharp ^0.35 on their own
  sharp: ^0.35.0

onlyBuiltDependencies:
  - '@prisma/engines'
  - '@sentry/cli'
  - prisma
  - sharp
  - unrs-resolver
