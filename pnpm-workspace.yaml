overrides:
  # advisory 1164783 (moderate, unzipSync infinite loop on malformed ZIP64,
  # >=0.7.0 <0.7.5). satori@0.33.5 (via @vercel/og@1.0.3) pins fflate@0.7.3
  # exactly, so the patched line is unreachable without an override.
  # Drop when satori pins fflate >=0.7.5 on its own
  fflate: ^0.7.5
  # advisories 1153173 (high, auth plugin downgrade to mysql_clear_password
  # leaking plaintext credentials, <3.22.0) and 1158532 (moderate, unbounded
  # zlib inflate in the compressed protocol handler, decompression-bomb DoS,
  # <=3.23.0). prisma@7.10.0 pins mysql2@3.15.3 exactly, so the patched line
  # is unreachable without an override. This project is Postgres-only
  # (@prisma/adapter-pg) — the MySQL driver never executes.
  # Drop when prisma pins mysql2 >=3.23.1 on its own
  mysql2: ^3.24.4
  # advisory 1145093 (high, stack exhaustion when merging recursive object
  # graphs, <8.0.0). @prisma/config@7.10.0 pins deepmerge-ts@7.1.5 exactly —
  # unreachable without an override.
  # Exercised at build time via prisma.config.ts.
  # Drop when @prisma/config pins deepmerge-ts >=8 on its own
  deepmerge-ts: ^8.0.0

allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@sentry/cli': true
  prisma: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  # pnpm >=11 enforces a release cooldown by default (minimumReleaseAge, 1440
  # minutes), so a version published less than a day ago will not resolve.
  # Every entry below waives that cooldown for one exact version.
  # The version-exact form is deliberate: it goes inert by itself once the pin
  # moves past it, unlike a bare name or a glob ('@types/*'), which would waive
  # the cooldown for that package permanently.
  # Inert is not harmless — a real waiver is hard to spot among dead ones,
  # so on every dep bump prune entries that no longer appear in pnpm-lock.yaml
  # or whose version is already past the cooldown.
  # Sentry 11.4.0 published 2026-10-02T16:39Z, lucide-react 1.50.0
  # 2026-10-02T11:25Z, @types/node 26.6.4 2026-10-01T22:39Z. Drop these exact
  # waivers once all three releases mature.
  - '@sentry/browser-utils@11.4.0'
  - '@sentry/browser@11.4.0'
  - '@sentry/bundler-plugins@11.4.0'
  - '@sentry/core@11.4.0'
  - '@sentry/feedback@11.4.0'
  - '@sentry/nextjs@11.4.0'
  - '@sentry/node@11.4.0'
  - '@sentry/opentelemetry@11.4.0'
  - '@sentry/react@11.4.0'
  - '@sentry/replay-canvas@11.4.0'
  - '@sentry/replay@11.4.0'
  - '@sentry/server-runtime-injection@11.4.0'
  - '@sentry/server-utils@11.4.0'
  - '@sentry/vercel-edge@11.4.0'
  - '@types/node@26.6.4'
  - lucide-react@1.50.0
